[project]
name = "my_little_birds"
version = "0.1.0"
description = "Personal information aggregator — daily digest of AI and econ research"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "feedparser>=6.0.11",
    "httpx[http2]>=0.27.0",
    "praw>=7.7.0",
    "rapidfuzz>=3.9.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
